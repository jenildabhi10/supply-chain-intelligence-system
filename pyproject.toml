[project]
name = "supply-chain-intelligence"
version = "0.1.0"
description = "Supply Chain Disruption Intelligence System — evidence-grounded risk prediction"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "APScheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]
ml = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "shap>=0.45.0",
    "optuna>=3.6.0",
    "mlflow>=2.13.0",
]
agent = [
    "groq>=0.9.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
all = ["supply-chain-intelligence[dev,ml,agent,api]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501  line length — handled by formatter, not worth bikeshedding
# UP042 prefer StrEnum — works the same as `(str, Enum)` we use today
# N803/N806 PascalCase variable names — domain code uses X, y, etc.
ignore = ["E501", "UP042", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use sectioned imports and inline assertions
"tests/**" = ["E402", "E701", "E721"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
